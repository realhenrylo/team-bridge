name: plugin bundle is current
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json packageManager
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @agent-room/bridge test
      - name: committed bundle must match a fresh build
        run: git diff --exit-code -- plugins/claude/agent-room/dist/agent-room.cjs plugins/codex/agent-room/dist/agent-room.cjs
